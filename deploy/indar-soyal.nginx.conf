# Include these locations in the INDAR default HTTPS server.
location = /soyal { return 308 /soyal/$is_args$args; }

location /soyal/api/ {
    proxy_pass http://127.0.0.1:3070/api/;
    proxy_read_timeout 30s;
}

location /soyal/ {
    alias /srv/web/soyal/;
    try_files $uri $uri/ /soyal/index.html;
    add_header Cache-Control "no-cache";
}
