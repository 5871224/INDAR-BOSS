# Include these locations in the INDAR default HTTPS server.
location = /soyal { return 308 /boss/$is_args$args; }
location ~ ^/soyal/(.*)$ { return 308 /boss/$1$is_args$args; }
location = /boss { return 308 /boss/$is_args$args; }

location /boss/api/ {
    proxy_pass http://127.0.0.1:3070/api/;
    proxy_read_timeout 30s;
}

location /boss/ {
    alias /srv/web/boss/;
    try_files $uri $uri/ /boss/index.html;
    add_header Cache-Control "no-cache";
}
