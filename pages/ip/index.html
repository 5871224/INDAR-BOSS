<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INDAR-BOSS｜IP檢查</title>
  <script>if (window.top === window) location.replace('../../#ip');</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/action-icons.css">
  <script src="/shared/auth-entry.js"></script>
</head>
<body>
  <section id="accessGate" class="gate" aria-labelledby="accessTitle">
    <h1 id="accessTitle">BOSS</h1><p id="accessMessage" role="status">正在確認 BOSS 使用權限…</p><a href="/">返回首頁</a>
  </section>
  <main class="wrap" id="appShell" hidden>
    <section class="card">
      <h2>檢查阻擋 IP</h2>
      <div class="ip-toolbar">
        <label class="file-button">匯入CSV<input id="events" type="file" accept=".csv,text/csv" hidden></label>
        <div class="merge-control" role="group" aria-label="合併數量">
          <button id="setThreshold" type="button">套用合併數</button>
          <input id="threshold" type="number" min="2" max="254" step="any" inputmode="decimal" aria-label="合併數量">
        </div>
        <button id="openExclusions" class="exclude-button" type="button">排除清單 <output id="exclusionSummary" class="exclusion-number" aria-label="排除 IP 數量">0</output></button>
      </div>
      <p id="blockStatus" class="ip-status" role="status" aria-live="polite"></p>
      <p id="excludeCounts" class="ip-exclude-counts" aria-live="polite"></p>
      <dialog id="exclusionDialog" aria-labelledby="exclusionTitle">
        <div class="exclusion-dialog-header">
          <h3 id="exclusionTitle">設定排除清單</h3>
          <button id="closeExclusions" class="exclusion-dialog-close" type="button" aria-label="關閉設定排除清單" title="關閉">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="exclusion-grid-wrap">
          <table class="exclusion-grid" aria-label="排除 IP 清單">
            <thead><tr><th scope="col">序號</th><th scope="col">排除 IP</th><th scope="col">操作</th></tr></thead>
            <tbody id="exclusionRows"></tbody>
          </table>
        </div>
        <p id="exclusionStatus" role="status" aria-live="polite"></p>
        <div class="actions"><button id="addExclusion" type="button">新增一列</button><button id="saveExclusions" class="primary" type="button">儲存</button></div>
      </dialog>
      <div class="table-wrap"><table><thead><tr><th scope="col" id="columnHeader-ip"><span class="th-inner"><span>IP</span><button type="button" id="columnTool-ip" class="header-icon column-tool" aria-haspopup="dialog" aria-controls="columnMenu" aria-expanded="false" aria-label="IP欄操作"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button></span></th><th scope="col" id="columnHeader-rule"><span class="th-inner"><span>轉格式</span><button type="button" id="copyRules" class="header-icon" title="複製去重後的阻擋規則" aria-label="複製去重後的阻擋規則"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><button type="button" id="columnTool-rule" class="header-icon column-tool" aria-haspopup="dialog" aria-controls="columnMenu" aria-expanded="false" aria-label="轉格式欄操作"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button></span></th><th scope="col" id="columnHeader-time"><span class="th-inner"><span>更新時間</span><button type="button" id="columnTool-time" class="header-icon column-tool" aria-haspopup="dialog" aria-controls="columnMenu" aria-expanded="false" aria-label="更新時間欄操作"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button></span></th><th scope="col" id="columnHeader-action"><span class="th-inner"><span>操作</span></span></th></tr></thead><tbody id="blockRows"></tbody></table></div>
      <div id="columnMenu" class="column-menu" role="dialog" aria-label="欄位操作" hidden>
        <div class="column-menu-sorts"><button id="columnSortAsc" type="button">升冪排序</button><button id="columnSortDesc" type="button">降冪排序</button></div>
        <label for="columnSearch">搜尋</label>
        <input id="columnSearch" type="search" autocomplete="off" placeholder="輸入關鍵字">
        <button id="columnFilterClear" class="column-filter-clear" type="button">清除搜尋</button>
      </div>
    </section>
  </main>
  <div id="copyToast" class="copy-toast" role="status" aria-live="polite" hidden>已複製</div>
  <script type="module" src="app.js"></script>
</body>
</html>
