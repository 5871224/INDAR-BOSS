<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INDAR-BOSS｜IP檢查</title>
  <script>if (window.top === window) location.replace('../../#ip');</script>
  <link rel="stylesheet" href="styles.css">
  <script src="/shared/auth-entry.js"></script>
</head>
<body>
  <section id="accessGate" class="gate" aria-labelledby="accessTitle">
    <h1 id="accessTitle">BOSS</h1><p id="accessMessage" role="status">正在確認 BOSS 使用權限…</p><a href="/">返回首頁</a>
  </section>
  <main class="wrap" id="appShell" hidden>
    <section class="card">
      <h2>檢查阻擋 IP</h2>
      <p>匯入事件 CSV（需有 eventTime、dstIp、srcIp 欄位）。相同 IP 取最新時間，排除清單中的 IP 不會加入阻擋清單。</p>
      <div class="actions"><label class="file-button">匯入事件 CSV<input id="events" type="file" accept=".csv,text/csv" hidden></label><label class="file-button">匯入既有清單 CSV<input id="list" type="file" accept=".csv,text/csv" hidden></label></div>
      <p class="note">既有清單 CSV 欄位：IP、更新時間（可包含轉格式）；由 Excel 另存為 UTF-8 CSV。阻擋 IP 與排除清單儲存在資料庫，具 BOSS 權限的使用者共用。</p>
      <div class="controls"><label>合併數量（2–254）<input id="threshold" type="number" min="2" max="254" step="1"></label><button id="setThreshold">套用</button><label>排序<select id="sort"><option value="ip">IP</option><option value="time">更新時間（新到舊）</option></select></label><button id="copyRules">複製去重後的阻擋規則</button><span id="blockStatus" role="status"></span></div>
      <div class="exclude"><button id="openExclusions" type="button">設定排除清單</button> <span id="exclusionSummary"></span><p id="excludeCounts" aria-live="polite"></p></div>
      <dialog id="exclusionDialog" aria-labelledby="exclusionTitle">
        <div class="exclusion-dialog-header">
          <h3 id="exclusionTitle">設定排除清單</h3>
          <button id="closeExclusions" class="exclusion-dialog-close" type="button" aria-label="關閉設定排除清單" title="關閉">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="exclusion-grid-wrap">
          <table class="exclusion-grid" aria-label="排除 IP 清單">
            <thead><tr><th scope="col">序號</th><th scope="col">排除 IP</th><th scope="col">操作</th></tr></thead>
            <tbody id="exclusionRows"></tbody>
          </table>
        </div>
        <p id="exclusionStatus" role="status" aria-live="polite"></p>
        <div class="actions"><button id="addExclusion" type="button">新增一列</button><button id="saveExclusions" class="primary" type="button">儲存</button></div>
      </dialog>
      <div class="table-wrap"><table><thead><tr><th>IP</th><th>轉格式</th><th>更新時間</th><th>操作</th></tr></thead><tbody id="blockRows"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
